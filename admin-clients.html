<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Inquiries - Admin</title>
  <link rel="stylesheet" href="/src/styles/global.css">
  <link rel="stylesheet" href="/src/styles/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <a href="/" class="admin-logo">ProShop</a>
        <span class="admin-badge">Admin</span>
      </div>

      <nav class="sidebar-nav">
        <a href="/admin-dashboard.html" class="nav-item">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="/admin-products.html" class="nav-item">
          <span class="nav-icon">📦</span>
          <span>Products</span>
        </a>
        <a href="/admin-clients.html" class="nav-item active">
          <span class="nav-icon">👥</span>
          <span>Client Inquiries</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button id="logoutBtn" class="logout-btn">
          <span>🚪</span> Logout
        </button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1>Client Inquiries</h1>
        <div style="display: flex; gap: 8px;">
          <select id="statusFilter" class="form-input" style="width: 150px;">
            <option value="">All Status</option>
            <option value="new">New</option>
            <option value="contacted">Contacted</option>
            <option value="resolved">Resolved</option>
          </select>
        </div>
      </header>

      <div class="admin-content">
        <div id="inquiriesTable" class="admin-table">
          <div class="loading">Loading inquiries...</div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/src/scripts/admin-clients.js"></script>
</body>
</html>
