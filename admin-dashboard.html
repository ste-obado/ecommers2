<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - ProShop</title>
  <link rel="stylesheet" href="/src/styles/global.css">
  <link rel="stylesheet" href="/src/styles/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <a href="/" class="admin-logo">ProShop</a>
        <span class="admin-badge">Admin</span>
      </div>

      <nav class="sidebar-nav">
        <a href="/admin-dashboard.html" class="nav-item active">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="/admin-products.html" class="nav-item">
          <span class="nav-icon">📦</span>
          <span>Products</span>
        </a>
        <a href="/admin-clients.html" class="nav-item">
          <span class="nav-icon">👥</span>
          <span>Client Inquiries</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button id="logoutBtn" class="logout-btn">
          <span>🚪</span> Logout
        </button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1>Dashboard</h1>
        <div class="admin-user">
          <span id="adminUserName">Loading...</span>
        </div>
      </header>

      <div class="admin-content">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon" style="background-color: #dbeafe;">📦</div>
            <div class="stat-info">
              <div class="stat-label">Total Products</div>
              <div class="stat-value" id="totalProducts">0</div>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon" style="background-color: #dcfce7;">👥</div>
            <div class="stat-info">
              <div class="stat-label">Client Inquiries</div>
              <div class="stat-value" id="totalInquiries">0</div>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon" style="background-color: #fef3c7;">👁️</div>
            <div class="stat-info">
              <div class="stat-label">Total Views</div>
              <div class="stat-value" id="totalViews">0</div>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon" style="background-color: #fce7f3;">🔗</div>
            <div class="stat-info">
              <div class="stat-label">Affiliate Clicks</div>
              <div class="stat-value" id="totalClicks">0</div>
            </div>
          </div>
        </div>

        <div class="dashboard-sections">
          <section class="dashboard-section">
            <h2>Recent Inquiries</h2>
            <div id="recentInquiries" class="inquiries-list">
              <div class="loading">Loading inquiries...</div>
            </div>
          </section>

          <section class="dashboard-section">
            <h2>Top Products</h2>
            <div id="topProducts" class="top-products-list">
              <div class="loading">Loading products...</div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/src/scripts/admin-dashboard.js"></script>
</body>
</html>
