<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products - Admin</title>
  <link rel="stylesheet" href="/src/styles/global.css">
  <link rel="stylesheet" href="/src/styles/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <a href="/" class="admin-logo">ProShop</a>
        <span class="admin-badge">Admin</span>
      </div>

      <nav class="sidebar-nav">
        <a href="/admin-dashboard.html" class="nav-item">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="/admin-products.html" class="nav-item active">
          <span class="nav-icon">📦</span>
          <span>Products</span>
        </a>
        <a href="/admin-clients.html" class="nav-item">
          <span class="nav-icon">👥</span>
          <span>Client Inquiries</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button id="logoutBtn" class="logout-btn">
          <span>🚪</span> Logout
        </button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1>Products</h1>
        <button id="addProductBtn" class="btn btn-primary">+ Add Product</button>
      </header>

      <div class="admin-content">
        <div id="productsTable" class="admin-table">
          <div class="loading">Loading products...</div>
        </div>
      </div>
    </main>
  </div>

  <div id="productModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add Product</h2>
        <button class="modal-close" id="closeModal">&times;</button>
      </div>

      <form id="productForm" class="modal-form">
        <input type="hidden" id="productId">

        <div class="form-row">
          <div class="form-group">
            <label for="title">Product Title *</label>
            <input type="text" id="title" name="title" required class="form-input">
          </div>

          <div class="form-group">
            <label for="category">Category *</label>
            <input type="text" id="category" name="category" required class="form-input" placeholder="e.g., electronics, fashion">
          </div>
        </div>

        <div class="form-group">
          <label for="short_description">Short Description *</label>
          <input type="text" id="short_description" name="short_description" required class="form-input" maxlength="150">
        </div>

        <div class="form-group">
          <label for="description">Full Description *</label>
          <textarea id="description" name="description" required class="form-textarea" rows="6"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="price">Price ($) *</label>
            <input type="number" id="price" name="price" required class="form-input" step="0.01" min="0">
          </div>

          <div class="form-group">
            <label for="affiliate_link">Affiliate Link (Digistore) *</label>
            <input type="url" id="affiliate_link" name="affiliate_link" required class="form-input" placeholder="https://...">
          </div>
        </div>

        <div class="form-group">
          <label for="image_url">Product Image URL *</label>
          <input type="url" id="image_url" name="image_url" required class="form-input" placeholder="https://...">
          <small>Paste image URL from Pexels, Unsplash, or upload to image hosting</small>
        </div>

        <div class="form-group">
          <label for="video_url">Product Video URL (Optional)</label>
          <input type="url" id="video_url" name="video_url" class="form-input" placeholder="https://...">
          <small>Direct link to MP4 video file</small>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="featured">Featured Product</label>
            <select id="featured" name="featured" class="form-input">
              <option value="false">No</option>
              <option value="true">Yes</option>
            </select>
          </div>

          <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status" class="form-input">
              <option value="active">Active</option>
              <option value="draft">Draft</option>
              <option value="archived">Archived</option>
            </select>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Product</button>
        </div>

        <div id="formMessage"></div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/scripts/admin-products.js"></script>
</body>
</html>
